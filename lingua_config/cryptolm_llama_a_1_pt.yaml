dump_dir: dump/exp5_cryptolm_llama_a_1_pt
name: exp5_cryptolm_llama_a_1_pt
steps: 7564
probe_freq: null
seed: 0

optim:
  lr: 3e-4
  weight_decay: 0.033
  warmup: 5000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  dp_shard: 16
  tp_size: 1

model:
  dim: 1536
  n_layers: 16
  n_heads: 12

data:
  root_dir: data/cryptollm_exp5
  sources:
      encrypted_dropped_chunk.00_alpha_poly_000001_1234_True: 180510.0
      encrypted_0.5_pretrain_chunk_00_alpha_poly_000001_1234_True: 4806260.0
      encrypted_0.25_pretrain_chunk_01_alpha_poly_000001_1234_True: 2409781.0
  batch_size: 32
  prefetch_size: 96
  seq_len: 2048
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: sp
    path: data/cryptollm_exp5/poly_1.model

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 1000
    keep: 3
  eval:
    every: 2000
    keep: 1

logging:
    freq: 10
    wandb:
        project: "cryptollm-lingua"

eval:
  harness:
    tasks:
      - hellaswag
      - piqa
      - openbookqa
      - winogrande
  generator:
    max_tokens: 4096
    dtype: bf16
  validation:
    max_steps: 1000
    use_val_from_train_src: false
    root_dir: data/cryptollm_exp5
    sources:
      - encrypted_0.5_pretrain_chunk_00_alpha_poly_000001_1234_True
